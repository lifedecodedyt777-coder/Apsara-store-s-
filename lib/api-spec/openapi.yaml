openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Category operations
  - name: products
    description: Product operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    patch:
      operationId: updateCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /products:
    get:
      operationId: getProducts
      tags: [products]
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: featured
          in: query
          schema:
            type: boolean
        - name: visible
          in: query
          schema:
            type: string
            description: "Pass 'all' for admin to see hidden products"
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        icon: { type: ["string", "null"] }
        sortOrder: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
    Product:
      type: object
      required: [id, name, description, shortDescription, price, featured, bestSeller, inStock, visible, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        shortDescription: { type: string }
        price: { type: number }
        comparePrice: { type: ["number", "null"] }
        categoryId: { type: ["integer", "null"] }
        imageUrl: { type: ["string", "null"] }
        featured: { type: boolean }
        bestSeller: { type: boolean }
        inStock: { type: boolean }
        visible: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    ProductInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        shortDescription: { type: string }
        price: { type: number }
        comparePrice: { type: ["number", "null"] }
        categoryId: { type: ["integer", "null"] }
        imageUrl: { type: ["string", "null"] }
        featured: { type: boolean }
        bestSeller: { type: boolean }
        inStock: { type: boolean }
        visible: { type: boolean }
        sortOrder: { type: integer }
    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        shortDescription: { type: string }
        price: { type: number }
        comparePrice: { type: ["number", "null"] }
        categoryId: { type: ["integer", "null"] }
        imageUrl: { type: ["string", "null"] }
        featured: { type: boolean }
        bestSeller: { type: boolean }
        inStock: { type: boolean }
        visible: { type: boolean }
        sortOrder: { type: integer }
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string }
    AdminToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
