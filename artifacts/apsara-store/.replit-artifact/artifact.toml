kind = "web"
previewPath = "/"
title = "Apsara Store"
version = "1.0.0"
id = "artifacts/apsara-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23453

[services.development]
run = "pnpm --filter @workspace/apsara-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apsara-store", "run", "build" ]
publicDir = "artifacts/apsara-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23453"
BASE_PATH = "/"
